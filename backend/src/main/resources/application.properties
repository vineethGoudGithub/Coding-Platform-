server.port=8080
server.servlet.context-path=/

spring.application.name=quiz-backend

# Local MySQL Database Configuration (JavaResults)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/JavaResults?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool (Optimized for 50 concurrent students)
spring.datasource.hikari.pool-name=QuizHikariCP
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT Security
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000

# Default Seed Admin Credentials
app.admin.email=${ADMIN_EMAIL:admin@assessment.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}

# Judge0 Code Execution
app.judge0.url=${JUDGE0_URL:https://ce.judge0.com}
app.judge0.api-key=${JUDGE0_API_KEY:}
app.judge0.api-host=${JUDGE0_API_HOST:}
app.judge0.java-language-id=62
app.judge0.timeout-seconds=5
app.judge0.max-output-length=10000
app.judge0.rate-limit-per-minute=15

# CORS Allowed Origins
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:3000,http://localhost}
